<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<div id="filter-container" style="margin-bottom: 10px;">
  <label for="category-filter">Category:</label>
  <select id="category-filter">
    <option value="all">All</option>
    <option value="hardware">Hardware</option>
    <option value="software">Software</option>
    <option value="safety">Safety</option>
    <option value="interface">Interface</option>
  </select>
  <label for="status-filter">Status:</label>
  <select id="status-filter">
    <option value="all">All</option>
    <option value="critical">Critical</option>
    <option value="implemented">Implemented</option>
    <option value="on schedule">On Schedule</option>
  </select>
</div>

<model-viewer
  id="modelViewer"
  src="onepartrx.glb"
  alt="A 3D model"
  camera-controls
  interaction-prompt="none"
  shadow-intensity="1"
  environment-image="neutral"
  ar
  ar-modes="webxr scene-viewer quick-look"
  disable-zoom
  camera-target="0m 0m 0m"
  style="width: 100%; height: 600px;"
>
  <!-- Hotspots will be injected by JS -->
</model-viewer>

<script>
const hotspots = [
  {
    slot: "hotspot-1",
    position: "-0.00205m -0.18925m 0.12460m",
    normal: "0m 0.5m 0.866m",
    category: "interface",
    status: "implemented",
    tooltip: "Display for user interaction"
  },
  {
    slot: "hotspot-2",
    position: "0.0258m -0.00105m 0.05346m",
    normal: "0m 1m 0m",
    category: "hardware",
    status: "critical",
    tooltip: "Printable volume of 120×120×120 mm"
  },
  {
    slot: "hotspot-3",
    position: "-0.0064m 0.0095m 0.0307m",
    normal: "0.05m 0m 1m",
    category: "hardware",
    status: "on schedule",
    tooltip: "Max Nozzle Temperature: 250°C"
  },
  {
    slot: "hotspot-4",
    position: "0.1809m -0.0575m -0.1249m",
    normal: "0m 0m 1m",
    category: "hardware",
    status: "implemented",
    tooltip: "Supported materials: PLA, ABS, and PETG"
  }
];

const hoveredHotspots = new Set();

function getStatusColor(status) {
  if (status === "critical") return "red";
  if (status === "implemented") return "green";
  if (status === "on schedule") return "yellow";
  return "gray";
}

function renderHotspots() {
  const modelViewer = document.getElementById("modelViewer");
  // Remove old hotspots (only those with class 'hotspot')
  Array.from(modelViewer.querySelectorAll(".hotspot")).forEach(e => e.remove());

  const category = document.getElementById("category-filter").value;
  const status = document.getElementById("status-filter").value;

  hotspots.forEach((hotspot, idx) => {
    if ((category === "all" || hotspot.category === category) &&
        (status === "all" || hotspot.status === status)) {
      const div = document.createElement("div");
      div.className = "hotspot";
      div.setAttribute("slot", hotspot.slot);
      div.setAttribute("data-position", hotspot.position);
      div.setAttribute("data-normal", hotspot.normal);
      div.setAttribute("data-visibility-attribute", "visible");
      div.style.background = getStatusColor(hotspot.status);
      div.style.width = "15px";
      div.style.height = "15px";
      div.style.borderRadius = "50%";
      div.style.border = hoveredHotspots.has(idx) ? "2px solid blue" : "none";
      div.style.cursor = "pointer";
      div.style.position = "relative";

      const annotation = document.createElement("div");
      annotation.className = "hotspotAnnotation";
      annotation.textContent = hotspot.tooltip;
      div.appendChild(annotation);

      div.addEventListener("mouseover", function() {
        if (!hoveredHotspots.has(idx)) {
          hoveredHotspots.add(idx);
          div.style.border = "2px solid blue";
        }
      });

      modelViewer.appendChild(div);
    }
  });
}

document.getElementById("category-filter").addEventListener("change", renderHotspots);
document.getElementById("status-filter").addEventListener("change", renderHotspots);

// Initial render
renderHotspots();
</script>

<style>
  model-viewer {
    width: 50%;
    height: 600px;
    max-width: 100%;
    display: block;
  }

  .hotspot {
    width: 15px;
    aspect-ratio: 1 / 1;
    height: auto;
    border-radius: 50%;
    border: none;
    padding: 0;
    margin: 0;
    display: block;
    pointer-events: auto;
    cursor: pointer;
    box-sizing: content-box;
    transform: scale(1);
  }

  .hotspotAnnotation {
    position: absolute;
    left: 50%;
    top: -40px;
    transform: translateX(-50%) translateY(-10px);
    display: none;
    background: white;
    color: black;
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 14px;
    max-width: 300px;
    text-align: center;
    overflow-wrap: break-word;
    word-break: normal;
    box-sizing: border-box;
    z-index: 20;
    text-transform: none;
  }

  .hotspot:hover .hotspotAnnotation {
    display: block;
  }
</style>
