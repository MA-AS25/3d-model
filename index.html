<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<model-viewer
  src="onepartrx.glb"
  alt="A 3D model"
  camera-controls
  interaction-prompt="none"
  shadow-intensity="1"
  environment-image="neutral"
  ar
  ar-modes="webxr scene-viewer quick-look"
  disable-zoom
  camera-target="0m 0m 0m"
  style="width: 100%; height: 600px;"
>
  <button class="hotspot" slot="hotspot-1" 
    data-position="-0.00205m -0.18925m 0.12460m" 
    data-normal="0m 0.5m 0.866m" 
    data-visibility-attribute="visible">
    <div class="hotspotAnnotation">Display for user interaction</div>
  </button>

  <button class="hotspot" slot="hotspot-2" 
    data-position="0.0258m -0.00105m 0.05346m" 
    data-normal="0m 1m 0m" 
    data-visibility-attribute="visible">
    <div class="hotspotAnnotation">Printable volume of 120×120×120 mm</div>
  </button>
  
    <button class="hotspot" slot="hotspot-3" 
    data-position="-0.0064m 0.0095m 0.0307m" 
    data-normal="0.05m 0m 1m" 
    data-visibility-attribute="visible">
    <div class="hotspotAnnotation">Max Nozzle Temperature: 250°C</div>
  </button>
  
    <button class="hotspot" slot="hotspot-4" 
    data-position="0.1809m -0.0575m -0.1249m" 
    data-normal="0m 0m 1m" 
    data-visibility-attribute="visible">
    <div class="hotspotAnnotation">Supported materials: PLA, ABS, and PETG</div>
  </button>

</model-viewer>

<style>
  model-viewer {
    width: 50%;
    height: 600px;
    max-width: 100%;
    display: block;
  }

  .hotspot {
      width: 15px;
      aspect-ratio: 1 / 1;
      height: auto;
      background: #2196f3;
      border-radius: 50%;
      border: none;
      padding: 0;
      margin: 0;
      display: block;
      pointer-events: auto;
      cursor: pointer;
      box-sizing: content-box;
      transform: scale(1);
    
  }

  .hotspotAnnotation {
      position: absolute;
      left: 50%;
      top: -40px;
      transform: translateX(-50%) translateY(-10px);
      display: none;
      background: white;
      color: black;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 14px;
      max-width: 90vw;
      text-align: center;
      overflow-wrap: break-word;
      word-break: normal;
      box-sizing: border-box;
      z-index: 20;
    text-transform: none;
  }

  .hotspot:hover .hotspotAnnotation {
    display: block;
  }
</style>
